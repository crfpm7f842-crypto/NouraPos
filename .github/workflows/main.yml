name: Build NouraPOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract NouraPOS source
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*NouraPOS*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "NouraPOS ZIP file was not found."
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR="$(find source -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project was not found inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" NouraPOS.apk
          ls -lh NouraPOS.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NouraPOS-apk
          path: NouraPOS.apk
